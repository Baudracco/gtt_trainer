services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: gtt_trainer
      POSTGRES_USER: gtt_trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtt_trainer"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_DSN: pgsql:host=db;port=5432;dbname=gtt_trainer
      DATABASE_USER: gtt_trainer
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      AUDIT_FALLBACK_LOG: /var/www/server/var/errors.log
      MEDIA_ACCEL_REDIRECT: '1'
    volumes:
      - serverdata:/var/www/server/var
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - serverdata:/var/www/server/var:ro
    depends_on:
      - api
  gtfs-sync:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    command: ["python3", "/var/www/tools/sync_gtfs.py", "--serve", "--apply"]
    environment:
      GTFS_DOWNLOAD_ENABLED: ${GTFS_DOWNLOAD_ENABLED:-1}
      DATABASE_DSN: pgsql:host=db;port=5432;dbname=gtt_trainer
      DATABASE_USER: gtt_trainer
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - serverdata:/var/www/server/var
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  serverdata:
