server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;
    server_tokens off;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        client_max_body_size 1030m;
        client_body_timeout 900s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/server/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass api:9000;
        fastcgi_read_timeout 180s;
    }
    location /_protected_media/ {
        internal;
        alias /var/www/server/var/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /data/ {try_files $uri =404;}
    location / {try_files $uri $uri/ /index.html;}
}
